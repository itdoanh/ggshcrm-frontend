<!-- views/topbar.html - Alpine component cho topbar -->

<div x-data="topbarView" class="flex items-center w-full gap-4">
  <!-- Mobile menu -->
  <button class="topbar-btn md:hidden" @click="toggleMobile()">
    <i data-lucide="menu"></i>
  </button>

  <!-- Collapse sidebar (desktop) -->
  <button class="topbar-btn hidden md:flex" @click="toggleSidebar()" title="Thu gọn sidebar">
    <i data-lucide="panel-left"></i>
  </button>

  <!-- Breadcrumb / Title -->
  <div class="breadcrumb hidden md:flex items-center gap-2 text-sm">
    <i data-lucide="home" style="width:14px;height:14px;color:#64748b;"></i>
    <span class="text-surface-400" x-text="currentRouteName"></span>
  </div>

  <!-- Search -->
  <div class="topbar-search hidden sm:block">
    <i data-lucide="search"></i>
    <input
      type="search"
      placeholder="Tìm kiếm lead, SĐT, họ tên..."
      x-model="search"
      @input.debounce.300ms="onSearch()"
    />
  </div>

  <!-- Spacer -->
  <div class="flex-1"></div>

  <!-- Actions -->
  <div class="topbar-actions">
    <!-- Live indicator -->
    <div class="hidden md:flex items-center gap-2 text-xs text-surface-400 px-3">
      <span class="status-dot pulse-dot" style="color:#10b981;width:6px;height:6px;"></span>
      <span>Đang đồng bộ</span>
    </div>

    <!-- Notifications -->
    <button class="topbar-btn" title="Thông báo">
      <i data-lucide="bell"></i>
      <span class="badge-dot"></span>
    </button>

    <!-- Settings -->
    <button class="topbar-btn" title="Cài đặt" @click="openSettings()">
      <i data-lucide="settings"></i>
    </button>

    <!-- User menu -->
    <div class="topbar-user" @click="logout()">
      <div class="user-avatar" x-text="initials"></div>
      <div class="user-info hidden sm:flex">
        <div class="user-name" x-text="fullName"></div>
        <div class="user-role" x-text="roleLabel"></div>
      </div>
    </div>
  </div>
</div>
