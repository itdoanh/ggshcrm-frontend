<!-- views/login.html -->
<!-- Render trực tiếp qua loginView component (xem bootstrap.js), không qua router -->

<div class="login-container">
  <div class="login-bg"></div>

  <!-- Floating orbs for visual depth -->
  <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-brand-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>
  <div class="absolute bottom-1/4 right-1/4 w-72 h-72 bg-accent-violet rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse" style="animation-delay: 1s"></div>

  <div class="login-card slide-up">
    <div class="login-logo">C</div>
    <h1 class="login-title">CRM Apex</h1>
    <p class="login-subtitle">Hệ thống quản lý khách hàng phân cấp</p>

    <form @submit.prevent="submit()" novalidate>
      <div x-show="showApiInput" class="form-group">
        <label class="form-label">
          <i data-lucide="link-2" class="inline-block w-3.5 h-3.5 mr-1"></i>
          API Endpoint
        </label>
        <input
          type="url"
          class="form-input"
          x-model="apiBase"
          placeholder="https://script.google.com/macros/s/.../exec"
          autocomplete="url"
        />
        <p class="text-xs text-surface-500 mt-1">Dán URL Apps Script Web App của bạn</p>
      </div>

      <div class="form-group">
        <label class="form-label">
          <i data-lucide="user" class="inline-block w-3.5 h-3.5 mr-1"></i>
          Tài khoản
        </label>
        <input
          type="text"
          class="form-input"
          x-model="username"
          placeholder="admin"
          autocomplete="username"
          autofocus
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label">
          <i data-lucide="lock" class="inline-block w-3.5 h-3.5 mr-1"></i>
          Mật khẩu
        </label>
        <input
          type="password"
          class="form-input"
          x-model="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <div class="flex items-center justify-between mb-5 text-sm">
        <label class="flex items-center gap-2 cursor-pointer text-surface-400">
          <input type="checkbox" x-model="remember" class="rounded border-surface-600 bg-surface-800 text-brand-500 focus:ring-brand-500">
          <span>Ghi nhớ đăng nhập</span>
        </label>
      </div>

      <div x-show="error" x-transition.opacity class="form-error flex items-center gap-2 mb-3 p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/20">
        <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
        <span x-text="error"></span>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-lg w-full"
        :disabled="loading"
      >
        <template x-if="!loading">
          <span class="flex items-center gap-2">
            <i data-lucide="log-in" class="w-4 h-4"></i>
            Đăng nhập
          </span>
        </template>
        <template x-if="loading">
          <span class="flex items-center gap-2">
            <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
            Đang xử lý...
          </span>
        </template>
      </button>
    </form>

    <div class="divider"></div>

    <p class="text-center text-xs text-surface-500">
      Powered by Google Sheets + Apps Script
      <br>
      <span class="text-surface-600">v1.0.0</span>
    </p>
  </div>
</div>
